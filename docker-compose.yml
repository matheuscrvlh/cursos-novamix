services:

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cursos-novamix-server
    restart: unless-stopped
    # só no 127.0.0.1 do servidor: o nginx do host acessa por aqui, mas a
    # porta não fica aberta pra internet (o Docker passa por cima do UFW, e
    # quem chegasse direto conseguiria forjar o IP no X-Forwarded-For)
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - app-network-develop

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cursos-novamix-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    networks:
      - app-network-develop

networks:
  app-network-develop:
    driver: bridge