services:

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cursos-novamix-server
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - app-network-develop

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cursos-novamix-client
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network-develop

networks:
  app-network-develop:
    driver: bridge