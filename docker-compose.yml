services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cursos-backend
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persiste o banco SQLite fora do container
      - sqlite_data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cursos-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  sqlite_data:

networks:
  app-network:
    driver: bridge
